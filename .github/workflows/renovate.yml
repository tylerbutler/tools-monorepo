# DISABLED: Switched to Dependabot
# See .github/dependabot.yml and .github/workflows/dependabot-build-artifacts.yml
name: Renovate (Disabled)
on:
  # schedule:
  #   # Run at 5 AM UTC on weekdays (matches "before 5am every weekday" in renovate.json5)
  #   - cron: '0 5 * * 1-5'
  workflow_dispatch:
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # ratchet:pnpm/action-setup@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: npm i --global corepack@latest
      - run: corepack enable

      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # ratchet:renovatebot/github-action@v46.3.9
        with:
          configurationFile: renovate.json5
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: "tylerbutler/tools-monorepo"
          RENOVATE_ALLOWED_COMMANDS: '["^pnpm .*"]'
          RENOVATE_ALLOW_SCRIPTS: true
