name: Setup Node.js and pnpm
description: Common setup for Node.js with pnpm and corepack

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - run: npm i --global corepack@latest
      shell: bash

    - run: corepack enable
      shell: bash

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: "pnpm"
        cache-dependency-path: pnpm-lock.yaml

    - run: pnpm --version
      shell: bash

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
