packages:
  - packages/*
  - config
executionEnv:
  nodeVersion: 22.23.1
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  msw: true
  nx: true
  sharp: true
  unrs-resolver: true
  workerd: true
  yarn: true
minimumReleaseAgeExclude:
  - generate-license-file@4.2.1
  - '@oclif/plugin-command-snapshot@6.0.7'
  - unist-util-visit-parents@6.1.0
  - unist-util-visit@5.2.0
  - '@oclif/plugin-commands@5.0.6'
  - '@oclif/plugin-not-found@4.0.6'
  - '@oclif/plugin-version@3.0.7'
  - '@oclif/plugin-plugins@7.0.12'
